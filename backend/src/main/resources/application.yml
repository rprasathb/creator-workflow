spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creator_workflow}
    username: ${DB_USER:creator}
    password: ${DB_PASSWORD:creator_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
