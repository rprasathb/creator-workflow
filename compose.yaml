services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creator_workflow
      POSTGRES_USER: ${DB_USER:-creator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creator_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - creator_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-creator} -d creator_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  creator_db:
